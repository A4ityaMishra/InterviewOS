<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<title>Sign in — InterviewOS</title>
<link rel="stylesheet" href="/static/theme.css?v=16">
<style>
  main { display: flex; align-items: center; justify-content: center; min-height: calc(100dvh - 54px); padding: 20px; }

  .card {
    width: 100%; max-width: 400px;
    background: var(--surface);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-2);
    padding: 40px;
    text-align: center;
    animation: step-in .38s var(--ease);
  }

  .glyph {
    width: 60px; height: 60px; border-radius: 50%; margin: 0 auto 20px;
    display: grid; place-items: center;
    background: linear-gradient(165deg, #5ac8fa 0%, #0071e3 55%, #004fa3 100%);
    box-shadow: 0 10px 30px rgba(0, 90, 180, .3);
    color: #fff;
  }

  .card h1 { font-size: 1.5rem; margin-bottom: 6px; }
  .card .sub { color: var(--text-2); font-size: .92rem; margin-bottom: 28px; }

  form { display: flex; flex-direction: column; gap: 14px; text-align: left; }
  .field { display: flex; flex-direction: column; gap: 7px; font-size: .84rem; font-weight: 600; color: var(--text); }
  .field input {
    background: var(--fill); border: 1px solid transparent; border-radius: var(--radius-sm);
    color: var(--text); padding: 12px 14px; min-height: 46px; font-weight: 400; font-size: 1rem;
    transition: background .2s var(--ease), border-color .2s var(--ease), box-shadow .2s var(--ease);
  }
  .field input:hover { background: var(--fill-2); }
  .field input:focus {
    background: var(--surface); border-color: var(--blue);
    box-shadow: 0 0 0 4px rgba(0, 113, 227, .14); outline: none;
  }

  .pw-wrap { position: relative; }
  .pw-wrap input { width: 100%; padding-right: 44px; }
  .pw-toggle {
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    width: 38px; height: 38px; border: 0; background: transparent; border-radius: 8px;
    display: grid; place-items: center; color: var(--text-3);
    transition: color .2s var(--ease), background .2s var(--ease);
  }
  .pw-toggle:hover { color: var(--text-2); background: var(--fill-2); }

  #submit-btn { margin-top: 6px; width: 100%; }

  .err {
    display: flex; align-items: center; gap: 8px;
    background: rgba(255, 59, 48, .1); color: var(--red-deep);
    border-radius: var(--radius-sm); padding: 11px 13px; font-size: .86rem; line-height: 1.4;
    animation: step-in .3s var(--ease);
  }
  .err svg { flex: none; }

  .hint { text-align: center; color: var(--text-3); font-size: .82rem; margin-top: 22px; line-height: 1.5; }

  .card { perspective: 900px; }
</style>
</head>
<body>
  <canvas id="fx-canvas" aria-hidden="true"></canvas>
  <div class="hud hud-left" id="hud-clock" aria-hidden="true"></div>
  <div class="hud hud-right" id="hud-coords" aria-hidden="true">X 0000&nbsp;&nbsp;Y 0000</div>
  <div id="cursor-dot" aria-hidden="true"></div>

  <header class="topnav">
    <a class="brand" href="/login" style="pointer-events:none;">
      <span class="mark">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
          <path d="M6 10v4"/><path d="M12 5v14"/><path d="M18 8v8"/>
        </svg>
      </span>
      InterviewOS
    </a>
    <div class="spacer"></div>
  </header>

  <main>
    <section class="card">
      <div class="glyph">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>
        </svg>
      </div>
      <h1>Sign in</h1>
      <p class="sub">Access the ops dashboard and test room.</p>

      <form id="login-form" autocomplete="on">
        <label class="field">Username
          <input type="text" name="username" autocomplete="username" required autofocus>
        </label>
        <label class="field">Password
          <div class="pw-wrap">
            <input type="password" name="password" id="pw-input" autocomplete="current-password" required>
            <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Show password" aria-pressed="false">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </label>
        <div class="err" id="err" role="alert" aria-live="polite" hidden>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v5"/><path d="M12 16h.01"/></svg>
          <span id="err-text">Invalid username or password.</span>
        </div>
        <button type="submit" class="btn-primary" id="submit-btn">Sign in</button>
      </form>

      <p class="hint">Don't have an account? Ask your ops admin to add you.</p>
    </section>
  </main>

  <script src="/static/login.js?v=2"></script>
  <script src="/static/fx.js?v=6"></script>
  <script>window.fxWordReveal(document.querySelector(".card h1"));</script>
</body>
</html>
