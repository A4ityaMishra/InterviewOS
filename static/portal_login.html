<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<title>Sign in — InterviewOS</title>
<link rel="stylesheet" href="/static/theme.css?v=26">
<style>
  main { display: flex; align-items: center; justify-content: center; min-height: calc(100dvh - 68px); padding: 20px; }

  .card {
    width: 100%; max-width: 400px;
    background: var(--surface);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-2);
    padding: 40px;
    text-align: center;
    animation: step-in .38s var(--ease);
  }

  .glyph {
    width: 60px; height: 60px; border-radius: 50%; margin: 0 auto 20px;
    display: grid; place-items: center;
    background: linear-gradient(165deg, #5ac8fa 0%, #0071e3 55%, #004fa3 100%);
    box-shadow: 0 10px 30px rgba(0, 90, 180, .3);
    color: #fff;
  }

  .card h1 { font-size: 1.5rem; margin-bottom: 6px; }
  .card .sub { color: var(--text-2); font-size: .92rem; margin-bottom: 22px; }

  .mode-toggle { margin-bottom: 20px; text-align: left; }

  form { display: flex; flex-direction: column; gap: 14px; text-align: left; }
  .field { display: flex; flex-direction: column; gap: 7px; font-size: .84rem; font-weight: 600; color: var(--text); }
  .field input {
    background: var(--fill); border: 1px solid transparent; border-radius: var(--radius-sm);
    color: var(--text); padding: 12px 14px; min-height: 46px; font-weight: 400; font-size: 1rem;
    transition: background .2s var(--ease), border-color .2s var(--ease), box-shadow .2s var(--ease);
  }
  .field input:hover { background: var(--fill-2); }
  .field input:focus {
    background: var(--surface); border-color: var(--blue);
    box-shadow: 0 0 0 4px rgba(0, 113, 227, .14); outline: none;
  }

  #submit-btn, #code-request-btn, #code-verify-btn { margin-top: 6px; width: 100%; }

  .err {
    display: flex; align-items: center; gap: 8px;
    background: rgba(255, 59, 48, .1); color: var(--red-deep);
    border-radius: var(--radius-sm); padding: 11px 13px; font-size: .86rem; line-height: 1.4;
    animation: step-in .3s var(--ease);
  }
  .err svg { flex: none; }

  .info-msg {
    background: var(--blue-soft); color: var(--blue);
    border-radius: var(--radius-sm); padding: 11px 13px; font-size: .86rem; line-height: 1.4;
    animation: step-in .3s var(--ease);
  }

  .hint { text-align: center; color: var(--text-3); font-size: .82rem; margin-top: 22px; line-height: 1.5; }
  .hint a { color: var(--blue); font-weight: 600; }
  .link-btn {
    background: none; border: 0; color: var(--blue); font-weight: 600; font-size: .84rem;
    cursor: pointer; padding: 0; text-align: left;
  }

  .card { perspective: 900px; }
</style>
</head>
<body>
  <canvas id="fx-canvas" aria-hidden="true"></canvas>
  <div class="hud hud-left" id="hud-clock" aria-hidden="true"></div>
  <div class="hud hud-right" id="hud-coords" aria-hidden="true">X 0000&nbsp;&nbsp;Y 0000</div>
  <div id="cursor-dot" aria-hidden="true"></div>

  <header class="topnav">
    <a class="brand" href="/apply" style="pointer-events:none;">
      <span class="mark">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
          <path d="M6 10v4"/><path d="M12 5v14"/><path d="M18 8v8"/>
        </svg>
      </span>
      InterviewOS
    </a>
    <div class="spacer"></div>
  </header>

  <main>
    <section class="card">
      <div class="glyph">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>
        </svg>
      </div>
      <h1>Sign in</h1>
      <p class="sub">Check your application status and join your interview.</p>

      <div class="mode-toggle segmented">
        <input type="radio" name="mode" id="mode-password" checked>
        <label for="mode-password"><b>Password</b></label>
        <input type="radio" name="mode" id="mode-code">
        <label for="mode-code"><b>Email me a code</b></label>
      </div>

      <form id="password-form" autocomplete="on">
        <label class="field">Email
          <input type="email" name="email" autocomplete="email" required autofocus>
        </label>
        <label class="field">Password
          <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <div class="err" id="pw-err" role="alert" aria-live="polite" hidden>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v5"/><path d="M12 16h.01"/></svg>
          <span id="pw-err-text">Invalid email or password.</span>
        </div>
        <button type="submit" class="btn-primary" id="submit-btn">Sign in</button>
      </form>

      <form id="code-request-form" autocomplete="on" hidden>
        <label class="field">Email
          <input type="email" name="email" autocomplete="email" required>
        </label>
        <div class="err" id="code-req-err" role="alert" hidden>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v5"/><path d="M12 16h.01"/></svg>
          <span id="code-req-err-text">Something went wrong.</span>
        </div>
        <button type="submit" class="btn-primary" id="code-request-btn">Send code</button>
      </form>

      <form id="code-verify-form" autocomplete="off" hidden>
        <p class="info-msg" id="code-sent-msg"></p>
        <label class="field">6-digit code
          <input type="text" name="code" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" required autofocus>
        </label>
        <div class="err" id="code-verify-err" role="alert" hidden>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v5"/><path d="M12 16h.01"/></svg>
          <span id="code-verify-err-text">Invalid or expired code.</span>
        </div>
        <button type="submit" class="btn-primary" id="code-verify-btn">Verify &amp; sign in</button>
        <button type="button" class="link-btn" id="code-back-btn" style="margin-top:10px;">Use a different email</button>
      </form>

      <p class="hint">New here? <a href="/portal/signup">Create an account</a></p>
    </section>
  </main>

  <script src="/static/portal_login.js?v=1"></script>
  <script src="/static/fx.js?v=11"></script>
  <script>window.fxWordReveal(document.querySelector(".card h1"));</script>
</body>
</html>
