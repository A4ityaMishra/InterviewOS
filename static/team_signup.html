<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<title>Join the team — InterviewOS</title>
<link rel="stylesheet" href="/static/theme.css?v=26">
<style>
  main { display: flex; align-items: center; justify-content: center; min-height: calc(100dvh - 68px); padding: 20px; }

  .card {
    width: 100%; max-width: 400px;
    background: var(--surface);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-2);
    padding: 40px;
    text-align: center;
    animation: step-in .38s var(--ease);
  }

  .glyph {
    width: 60px; height: 60px; border-radius: 50%; margin: 0 auto 20px;
    display: grid; place-items: center;
    background: linear-gradient(165deg, #5ac8fa 0%, #0071e3 55%, #004fa3 100%);
    box-shadow: 0 10px 30px rgba(0, 90, 180, .3);
    color: #fff;
  }

  .card h1 { font-size: 1.5rem; margin-bottom: 6px; }
  .card .sub { color: var(--text-2); font-size: .92rem; margin-bottom: 28px; }

  form { display: flex; flex-direction: column; gap: 14px; text-align: left; }
  .field { display: flex; flex-direction: column; gap: 7px; font-size: .84rem; font-weight: 600; color: var(--text); }
  .field input {
    background: var(--fill); border: 1px solid transparent; border-radius: var(--radius-sm);
    color: var(--text); padding: 12px 14px; min-height: 46px; font-weight: 400; font-size: 1rem;
    transition: background .2s var(--ease), border-color .2s var(--ease), box-shadow .2s var(--ease);
  }
  .field input:hover { background: var(--fill-2); }
  .field input:focus {
    background: var(--surface); border-color: var(--blue);
    box-shadow: 0 0 0 4px rgba(0, 113, 227, .14); outline: none;
  }
  .field input:disabled { color: var(--text-3); cursor: default; }

  #submit-btn { margin-top: 6px; width: 100%; }

  .err {
    display: flex; align-items: center; gap: 8px;
    background: rgba(255, 59, 48, .1); color: var(--red-deep);
    border-radius: var(--radius-sm); padding: 11px 13px; font-size: .86rem; line-height: 1.4;
    animation: step-in .3s var(--ease);
  }
  .err svg { flex: none; }

  .card { perspective: 900px; }
</style>
</head>
<body>
  <canvas id="fx-canvas" aria-hidden="true"></canvas>
  <div class="hud hud-left" id="hud-clock" aria-hidden="true"></div>
  <div class="hud hud-right" id="hud-coords" aria-hidden="true">X 0000&nbsp;&nbsp;Y 0000</div>
  <div id="cursor-dot" aria-hidden="true"></div>

  <header class="topnav">
    <a class="brand" href="/login" style="pointer-events:none;">
      <span class="mark">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
          <path d="M6 10v4"/><path d="M12 5v14"/><path d="M18 8v8"/>
        </svg>
      </span>
      InterviewOS
    </a>
    <div class="spacer"></div>
  </header>

  <main>
    <section class="card" id="invalid-card" hidden>
      <div class="glyph" style="background: linear-gradient(165deg, #ff9f7a 0%, #ff3b30 60%, #a30d00 100%); box-shadow: 0 10px 30px rgba(180, 30, 0, .3);">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v5"/><path d="M12 16h.01"/></svg>
      </div>
      <h1>Invite not found</h1>
      <p class="sub">This invite link is invalid or has expired. Ask whoever invited you to send a new one.</p>
    </section>

    <section class="card" id="form-card" hidden>
      <div class="glyph">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
        </svg>
      </div>
      <h1>Join the team</h1>
      <p class="sub" id="invite-sub">You've been invited to join.</p>

      <form id="signup-form" autocomplete="on">
        <label class="field">Email
          <input type="email" id="email-input" disabled>
        </label>
        <label class="field">Full name
          <input type="text" name="name" autocomplete="name" required autofocus>
        </label>
        <label class="field">Password
          <input type="password" name="password" autocomplete="new-password" minlength="8" required>
        </label>
        <label class="field">Confirm password
          <input type="password" name="confirm_password" autocomplete="new-password" minlength="8" required>
        </label>
        <div class="err" id="err" role="alert" aria-live="polite" hidden>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v5"/><path d="M12 16h.01"/></svg>
          <span id="err-text">Something went wrong.</span>
        </div>
        <button type="submit" class="btn-primary" id="submit-btn">Create account</button>
      </form>
    </section>
  </main>

  <script src="/static/team_signup.js?v=1"></script>
  <script src="/static/fx.js?v=11"></script>
</body>
</html>
