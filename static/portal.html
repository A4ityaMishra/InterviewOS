<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<title>My Applications — InterviewOS</title>
<link rel="stylesheet" href="/static/theme.css?v=26">
<style>
  main { display: flex; flex-direction: column; align-items: center; padding: clamp(28px, 6vh, 64px) 20px 80px; }
  .wrap { width: 100%; max-width: 640px; }
  .wrap-header h1 { font-size: 1.7rem; }
  .wrap-header p { color: var(--text-2); font-size: .94rem; margin-top: 4px; margin-bottom: 28px; }

  .app-card {
    background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-1);
    padding: 20px 22px; margin-bottom: 14px;
    animation: step-in .35s var(--ease) backwards;
  }
  .app-card .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .app-card .role { font-weight: 600; font-size: 1.05rem; }
  .app-card .meta { color: var(--text-3); font-size: .82rem; margin-top: 3px; }
  .app-card .rejection { color: var(--text-2); font-size: .86rem; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--fill-2); }
  .app-card .join-row { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--fill-2); }
  .app-card .join-row .btn-primary { width: 100%; }
  .app-card .join-note { color: var(--text-3); font-size: .8rem; margin-top: 8px; text-align: center; }

  .empty { text-align: center; padding: 60px 24px; color: var(--text-2); }
  .empty svg { color: var(--text-3); margin-bottom: 14px; }
  .empty p { font-size: .94rem; margin-bottom: 18px; }

  .portal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
</style>
</head>
<body>
  <canvas id="fx-canvas" aria-hidden="true"></canvas>
  <div class="hud hud-left" id="hud-clock" aria-hidden="true"></div>
  <div class="hud hud-right" id="hud-coords" aria-hidden="true">X 0000&nbsp;&nbsp;Y 0000</div>
  <div id="cursor-dot" aria-hidden="true"></div>

  <header class="topnav">
    <a class="brand" href="/portal" style="pointer-events:none;">
      <span class="mark">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
          <path d="M6 10v4"/><path d="M12 5v14"/><path d="M18 8v8"/>
        </svg>
      </span>
      InterviewOS
    </a>
    <div class="spacer"></div>
    <div class="user-chip" id="user-chip" hidden>
      <button class="chip-trigger" id="chip-trigger" type="button" aria-haspopup="true" aria-expanded="false">
        <span class="av" id="chip-av"></span>
        <span class="name" id="chip-name"></span>
        <svg class="chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="user-menu" id="user-menu" role="menu">
        <button type="button" class="danger" id="logout-btn" role="menuitem">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
          Log out
        </button>
      </div>
    </div>
  </header>

  <main>
    <div class="wrap">
      <div class="wrap-header">
        <h1>My applications</h1>
        <p>Track your application status and join your interview when it's scheduled.</p>
      </div>

      <div id="apps"></div>
    </div>
  </main>

  <script src="/static/portal.js?v=1"></script>
  <script src="/static/fx.js?v=11"></script>
</body>
</html>
